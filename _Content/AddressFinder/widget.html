<label for="resultPrefix">Result Prefix:</label>
<div class="form-group" data-bind="css: { 'has-error has-feedback': validation.resultPrefix }, attr: { title: validation.resultPrefix }">
    <input type="text" id="resultPrefix" class="form-control input-sm" data-bind="value: resultPrefix" />
    <span class="fa fa-warning form-control-feedback" data-bind="visible: validation.resultPrefix"></span>
</div>
